<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transfer Zinciri</title>
<meta name="theme-color" content="#000000"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#000;--card:#0b0b0b;--tx:#fff;--mu:#a89f80;--ac:#FFC400;--bad:#ff5a4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:11px/1.8 "Press Start 2P",ui-monospace,Menlo,Consolas,monospace;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
#app{max-width:480px;margin:0 auto;padding:16px}h1{font-size:15px;line-height:1.6;margin:6px 0;color:var(--ac)}.mu{color:var(--mu);font-size:9px;line-height:1.7}p{margin:8px 0}
.card{background:var(--card);border:3px solid var(--ac);padding:12px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.av,.cl{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.av{width:46px;height:46px;border:2px solid var(--ac);font-size:11px}.cl{width:26px;height:26px;border:1px solid #333;font-size:7px;margin:0 4px 4px 0}
.av img,.cl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.cl img{object-fit:contain;padding:2px;background:#fff}
.clubs{display:flex;flex-wrap:wrap;margin-top:8px}
.link{margin:2px 0 2px 22px;padding:4px 0 0 18px;border-left:3px dashed var(--ac);min-height:34px;display:flex;align-items:center}
input{width:100%;padding:14px;font:12px "Press Start 2P",monospace;border:3px solid var(--ac);background:#000;color:#fff;border-radius:0;outline:0}
input::placeholder{color:#6b6444}
button{font:11px "Press Start 2P",monospace;padding:12px 14px;border:0;border-radius:0;background:var(--ac);color:#000;cursor:pointer;box-shadow:0 4px 0 #8a6a00}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a00}button.g{background:#000;color:var(--ac);border:2px solid var(--ac);box-shadow:none}button:disabled{opacity:.3;cursor:default}
.sg{padding:8px 10px;border-bottom:1px dashed #3a3416;cursor:pointer}.sg:last-child{border:0}.sg:active{background:#1c1700}
.msg{color:var(--bad);font-size:9px;min-height:22px;margin:8px 0}.tgt{box-shadow:0 0 0 2px #000,0 0 0 4px var(--ac)}.big{font-size:12px;color:var(--ac)}
.stats{display:flex;gap:8px;text-align:center}.stats div{flex:1}.stats b{display:block;font-size:18px;color:var(--ac);font-weight:400}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:18px;background:#000;border-top:3px solid var(--ac);padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:9}
.gn{text-align:center;min-width:150px;color:var(--ac);font-size:12px}
</style></head><body><div id="app"></div>
<script>
// ===== AYARLAR: CSV dosyalarının repo içindeki yolu =====
const CFG={profiles:"player_profiles.csv",transfers:"transfer_history.csv",top:20000,since:1985,cache:"tz_data_v2"};
const app=document.getElementById("app"),LOGO=id=>`https://tmssl.akamaized.net/images/wappen/head/${id}.png`,NOW=2026.8;
const norm=s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
let P,CN,ADJ,W,A,B,OPT,TODAY,CUR,READY=false,S={user:"",days:{},prog:{}},chain,mist=0,msg="",q="";
try{S=JSON.parse(localStorage.getItem("tz"))||S}catch(e){}S.days=S.days||{};S.prog=S.prog||{};
const save=()=>{try{localStorage.setItem("tz",JSON.stringify(S))}catch(e){}};

// ===== CSV -> oyun verisi =====
const col=(F,...c)=>{const low=F.map(x=>x.toLowerCase());for(const k of c){const i=low.indexOf(k);if(i>=0)return F[i]}for(const k of c){const i=low.findIndex(x=>x.includes(k));if(i>=0)return F[i]}return null};
const money=v=>{if(v==null)return 0;const s=String(v).toLowerCase().replace(/,/g,""),m=s.match(/[\d.]+/);if(!m)return 0;const x=parseFloat(m[0]);return isNaN(x)?0:x*(s.includes("m")?1e6:s.includes("k")?1e3:1)};
function toYear(d,se){const t=Date.parse(d);if(!isNaN(t)){const x=new Date(t);return x.getFullYear()+x.getMonth()/12+(x.getDate()-1)/365}const m=String(se||"").match(/^(\d\d)\/(\d\d)/);if(m){const y=+m[1];return(y>50?1900:2000)+y+0.5}return null}
function readCsv(url,label,fn){return new Promise((res,rej)=>{let n=0,F=null;Papa.parse(url,{download:true,header:true,skipEmptyLines:true,worker:false,
step:r=>{F=F||r.meta.fields;fn(r.data,F);if(++n%25000===0){const e=document.getElementById("prog");if(e)e.textContent=`${label} okunuyor… ${n.toLocaleString("tr")} satır (ilk açılış uzun sürebilir)`}},
complete:()=>n?res(F):rej(new Error(`${url} boş ya da bulunamadı.`)),error:()=>rej(new Error(`${url} okunamadı. Dosya repoda bu yolda mı?`))})})}
function need(F,label,...c){const r=col(F,...c);if(!r)throw new Error(`'${label}' sütunu bulunamadı.\nMevcut sütunlar: ${F.join(", ")}`);return r}
async function build(){
const prof={};let pc;await readCsv(CFG.profiles,"Oyuncular",(r,F)=>{pc=pc||{id:need(F,"oyuncu id","player_id"),n:need(F,"oyuncu adı","player_name","name"),img:col(F,"image","photo"),v:col(F,"market_value"),c:col(F,"current_club_name")};
const id=r[pc.id];if(id&&!prof[id])prof[id]={n:r[pc.n],img:pc.img&&/^http/.test(r[pc.img]||"")?r[pc.img]:"",v:pc.v?money(r[pc.v]):0,c:pc.c?(r[pc.c]||""):""}});
const T={};let tc;await readCsv(CFG.transfers,"Transferler",(r,F)=>{tc=tc||{id:need(F,"oyuncu id","player_id"),to:need(F,"hedef takım id","to_team_id","to_club_id"),tn:need(F,"hedef takım adı","to_team_name","to_club_name"),d:col(F,"transfer_date","date"),s:col(F,"season"),v:col(F,"value_at_transfer","market_value")};
const id=r[tc.id],to=r[tc.to];if(!id||!to||!prof[id])return;const t=toYear(tc.d?r[tc.d]:null,tc.s?r[tc.s]:null);if(t==null)return;(T[id]??=[]).push([t,to,r[tc.tn],tc.v?money(r[tc.v]):0])});
const BAD=/retired|without club|career break|unknown|^ban$|suspended/i,clubs={},L=[];
for(const id in T){const g=T[id].sort((a,b)=>a[0]-b[0]),s=[];let f=prof[id].v;
g.forEach(([t,to,tn,v],i)=>{f=Math.max(f,v);const end=i+1<g.length?g[i+1][0]:(t>NOW-8?NOW:t+3);if(BAD.test(tn)||end-t<0.5)return;s.push([+to,+t.toFixed(1),+end.toFixed(1)]);clubs[to]=tn});
if(s.length&&Math.max(...s.map(x=>x[2]))>=CFG.since)L.push({f,k:s.length,id:+id,n:prof[id].n,img:prof[id].img,c:prof[id].c,s})}
L.sort((a,b)=>b.f-a.f||b.k-a.k);const players=L.slice(0,CFG.top).map(({id,n,img,c,s})=>({id,n,img,c,s}));
const used=new Set(players.flatMap(p=>p.s.map(x=>x[0])));for(const c in clubs)if(!used.has(+c))delete clubs[c];
return{clubs,players}}
async function load(){
try{const c=localStorage.getItem(CFG.cache);if(c)return JSON.parse(c)}catch(e){}
const D=await build();try{localStorage.setItem(CFG.cache,JSON.stringify(D))}catch(e){}return D}
load().then(init).catch(e=>app.innerHTML=`<div class="card"><b>Hata</b><pre style="white-space:pre-wrap;font-size:13px">${esc(e.message)}</pre><p class="mu">Çözülmezse bu mesajı Claude'a yapıştır.</p></div>`);

// ===== Oyun =====
const EPOCH=Date.UTC(2026,10,1),TZ="Europe/Istanbul",BIAS=0.5; // EPOCH: #1 numaralı grid'in tarihi, BIAS: büyük takım oyuncularının şans artışı
const dayNo=()=>{const[y,m,d]=new Date().toLocaleDateString("sv",{timeZone:TZ}).split("-").map(Number);return Math.max(1,Math.floor((Date.UTC(y,m-1,d)-EPOCH)/864e5)+1)};
const ov=(x,y)=>Math.min(x[2],y[2])-Math.max(x[1],y[1])>=0.5;
const shared=(i,j)=>{const r=new Set;for(const x of P[i].s)for(const y of P[j].s)if(x[0]===y[0]&&ov(x,y))r.add(x[0]);return[...r]};
function bfs(a){const d=new Int16Array(P.length).fill(-1),pr=new Int32Array(P.length).fill(-1);d[a]=0;const q=[a];for(let h=0;h<q.length;h++){const x=q[h];for(const y of ADJ[x])if(d[y]<0){d[y]=d[x]+1;pr[y]=x;q.push(y)}}return{d,pr}}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function wpick(R,L){let s=0;for(const i of L)s+=W[i];let r=R()*s;for(const i of L){r-=W[i];if(r<=0)return i}return L[L.length-1]}
function init(D){P=D.players;CN=D.clubs;const by={};P.forEach((p,i)=>p.s.forEach(s=>(by[s[0]]??=[]).push([i,s])));
ADJ=P.map(()=>new Set);for(const c in by){const L=by[c];for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++){const[i,a]=L[x],[j,b]=L[y];if(i!==j&&ov(a,b)){ADJ[i].add(j);ADJ[j].add(i)}}}
const pres={};P.slice(0,1500).forEach(p=>new Set(p.s.map(x=>x[0])).forEach(c=>pres[c]=(pres[c]||0)+1));
const big=new Set(Object.entries(pres).sort((a,b)=>b[1]-a[1]).slice(0,40).map(e=>+e[0]));
W=P.map(p=>1+BIAS*Math.min(3,new Set(p.s.map(x=>x[0]).filter(c=>big.has(c))).size));
TODAY=dayNo();CUR=TODAY;READY=true;if(S.user)loadPuzzle(CUR);
setInterval(tick,20000);document.addEventListener("visibilitychange",tick)}
function makePuzzle(n){const R=rng(n*7919+13),all=P.map((_,i)=>i);
for(let k=0;k<400;k++){const a=wpick(R,all),{d}=bfs(a),c=[];for(let j=0;j<P.length;j++)if(d[j]>=3&&d[j]<=4)c.push(j);if(c.length){const b=wpick(R,c);return[a,b,d[b]]}}return null}
function loadPuzzle(n){CUR=n;const pz=makePuzzle(n);if(!pz)return app.textContent="Bulmaca üretilemedi.";[A,B,OPT]=pz;const pr=S.prog[n];chain=pr?pr.c.slice():[A];mist=pr?pr.m:0;msg="";q="";render()}
function tick(){if(!READY)return;const t=dayNo();if(t!==TODAY){const was=CUR===TODAY;TODAY=t;if(was&&S.user)loadPuzzle(TODAY);else if(S.user)render()}}
const ini=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("");
const av=i=>`<span class="av" style="background:hsl(${hue(P[i].n)},45%,30%)">${esc(ini(P[i].n))}${P[i].img?`<img src="${esc(P[i].img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</span>`;
const cl=c=>`<span class="cl" title="${esc(CN[c]||"")}" style="background:hsl(${hue(c)},55%,40%)">${esc((CN[c]||"").replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,"").slice(0,3).toUpperCase())}<img src="${LOGO(c)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
const clubsOf=i=>[...new Set(P[i].s.map(x=>x[0]))];
const hist=()=>Object.entries(S.days).filter(([k])=>/^\d+$/.test(k)).map(e=>e[1]);
const livew=n=>S.days[n]?.w&&S.days[n].live;
const streak=()=>{let n=TODAY;if(!livew(n))n--;let c=0;while(n>0&&livew(n)){c++;n--}return c};
function start(){if(!S.user)login();else app.innerHTML=`<h1>TRANSFER ZİNCİRİ</h1><p class="mu" id="prog">Yükleniyor…</p>`}
function login(){app.innerHTML=`<h1>TRANSFER<br>ZİNCİRİ</h1><p class="mu">İki futbolcuyu ortak takım arkadaşlarıyla bağla. Her gün yeni bir grid!</p><div class="card"><p class="big">HESAP OLUŞTUR</p><p class="mu">Bir nick seç. Bir daha giriş yapman gerekmez.</p><input id="u" maxlength="16" placeholder="NICK" autocomplete="off" autocapitalize="off"><div class="msg" id="e"></div><button id="go" style="width:100%">BAŞLA ▶</button></div><p class="mu" id="prog"></p>`;
document.getElementById("go").onclick=()=>{const v=document.getElementById("u").value.trim();if(!/^[\p{L}\p{N}_.\-]{3,16}$/u.test(v))return document.getElementById("e").textContent="3-16 karakter: harf, rakam, _ . -";
S.user=v;S.created=Date.now();save();if(READY)loadPuzzle(CUR);else start()}}
function share(){const r=S.days[CUR],t=`TRANSFER ZİNCİRİ #${CUR}\n${P[A].n} → ${P[B].n}\n${r.w?"🟨".repeat(r.l)+` (${r.l} halka, en kısa ${OPT})`:"⬛ Çözemedim"}${r.m?"\n❌×"+r.m:""}\n🔥 Seri: ${streak()}`;
if(navigator.share)navigator.share({text:t}).catch(()=>{});else try{navigator.clipboard.writeText(t);alert("Kopyalandı!")}catch(e){prompt("Kopyala:",t)}}
const nav=()=>`<div id="nav"><button class="g" id="pv" ${CUR<=1?"disabled":""}>◀</button><div class="gn">GRID #${CUR} ${S.days[CUR]?(S.days[CUR].w?"✓":"✗"):""}<div class="mu">${CUR===TODAY?"BUGÜN":"ARŞİV"}</div></div><button class="g" id="nx" ${CUR>=TODAY?"disabled":""}>▶</button></div>`;
const bindNav=()=>{document.getElementById("pv").onclick=()=>loadPuzzle(CUR-1);document.getElementById("nx").onclick=()=>loadPuzzle(CUR+1)};
function render(){if(!S.user)return login();const r=S.days[CUR];
let h=`<h1>TRANSFER ZİNCİRİ</h1><span class="mu">👤 ${esc(S.user)} · 🔥 ${streak()}</span>`;
h+=`<div class="card tgt"><div class="mu">HEDEF · en kısa yol ${OPT} halka</div><div class="row" style="margin-top:8px">${av(B)}<div>${esc(P[B].n)}<div class="clubs">${clubsOf(B).map(cl).join("")}</div></div></div></div><div class="card">`;
chain.forEach((n,i)=>{if(i)h+=`<div class="link">${shared(chain[i-1],n).map(cl).join("")}</div>`;h+=`<div class="row">${av(n)}<div>${esc(P[n].n)}</div></div>`});h+=`</div>`;
if(r){const path=[],{pr}=bfs(A);for(let x=B;x>=0;x=pr[x])path.unshift(P[x].n);const hs=hist();
h+=`<div class="card"><p class="big">${r.w?"ÇÖZDÜN! "+r.l+" HALKA":"BU GRID OLMADI"}</p><p class="mu">Hata: ${r.m}. ${r.w&&r.l===OPT?"Mükemmel, en kısa yol!":"En kısa yol: "+path.map(esc).join(" → ")}</p><button id="sh" style="width:100%">PAYLAŞ</button></div>
<div class="card stats"><div><b>${hs.length}</b><span class="mu">oynanan</span></div><div><b>${hs.filter(d=>d.w).length}</b><span class="mu">çözülen</span></div><div><b>${streak()}</b><span class="mu">seri</span></div></div>`+(CUR===TODAY?`<p class="mu" style="text-align:center">Yeni grid 00:00'da!</p>`:"");
app.innerHTML=h+nav();document.getElementById("sh").onclick=share;bindNav();return}
const last=chain[chain.length-1];
h+=`<div class="card"><div class="mu">ŞU AN: <span style="color:var(--ac)">${esc(P[last].n)}</span><br>Ortak takımda oynadığı bir futbolcu yaz</div><div class="clubs">${clubsOf(last).map(cl).join("")}</div><p></p><input id="q" placeholder="FUTBOLCU ARA…" value="${esc(q)}" autocomplete="off"><div class="msg">${esc(msg)}</div><div id="sg"></div><div class="row sp mu">HATA: ${mist}/5<button class="g" id="un" ${chain.length<2?"disabled":""}>GERİ AL</button></div></div>`;
app.innerHTML=h+nav();bindNav();const inp=document.getElementById("q"),sg=document.getElementById("sg");
inp.oninput=()=>{q=inp.value;const v=norm(q);if(!v){sg.innerHTML="";return}const L=[];for(let i=0;i<P.length&&L.length<6;i++)if(!chain.includes(i)&&norm(P[i].n).includes(v))L.push(i);
sg.innerHTML=L.length?`<div class="card" style="padding:0">`+L.map(i=>`<div class="sg row" data-i="${i}">${av(i)}<div>${esc(P[i].n)}<div class="mu">${esc(P[i].c||"")}</div></div></div>`).join("")+`</div>`:"";
sg.querySelectorAll(".sg").forEach(e=>e.onclick=()=>pick(+e.dataset.i))};
if(q)inp.oninput();
document.getElementById("un").onclick=()=>{if(chain.length>1){chain.pop();msg="";q="";S.prog[CUR]={c:chain,m:mist};save();render()}}}
function pick(i){q="";const last=chain[chain.length-1];
if(ADJ[last].has(i)){chain.push(i);msg="";if(i===B){S.days[CUR]={w:1,l:chain.length-1,m:mist,live:CUR===TODAY?1:0};delete S.prog[CUR]}else S.prog[CUR]={c:chain,m:mist}}
else{mist++;msg=`${P[i].n}, ${P[last].n} ile ortak takımda oynamadı ❌`;if(mist>=5){S.days[CUR]={w:0,l:0,m:mist,live:0};delete S.prog[CUR]}else S.prog[CUR]={c:chain,m:mist}}
save();render()}
start();
</script></body></html>
