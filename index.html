<style>

.hd{position:relative;z-index:1}
button.mb{background:none;border:0;box-shadow:none;padding:6px;margin-left:-6px;color:rgba(255,255,255,.35);display:flex;border-radius:10px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}.dim.on{opacity:1;pointer-events:auto}
.drw{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:rgba(14,14,14,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:calc(24px + env(safe-area-inset-top)) 16px 24px;z-index:21;display:flex;flex-direction:column;gap:4px}.drw.on{transform:none}
button.mi{background:none;box-shadow:none;border:0;text-align:left;color:#e9e5d2;font:600 15px "Plus Jakarta Sans",system-ui,sans-serif;padding:14px 14px;border-radius:14px;width:100%}button.mi.on{background:rgba(255,196,0,.10);color:var(--ac)}
details.qa{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:0 16px;margin:10px 0}
details.qa summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.qa[open] summary::after{transform:rotate(-135deg)}
details.qa p{color:#bdb8a3;font-size:13.5px;line-height:1.6;margin:0 0 15px}
</style></head><body><div id="app"></div>
<script>
// ===== AYARLAR: CSV dosyalarının repo içindeki yolu =====
const CFG={profiles:"player_profiles.csv",transfers:"transfer_history.csv",top:20000,since:1985,cache:"tz_data_v7",updates:"updates.csv"};
const app=document.getElementById("app"),LOGO=id=>`https://tmssl.akamaized.net/images/wappen/head/${id}.png`,NOW=2026.8;
const norm=s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
let P,CN,ADJ,A,B,OPT,TODAY,CUR,READY=false,S={user:"",days:{},prog:{}},chain,mist=0,msg="",q="";
try{S=JSON.parse(localStorage.getItem("tz"))||S}catch(e){}S.days=S.days||{};S.prog=S.prog||{};
const save=()=>{try{localStorage.setItem("tz",JSON.stringify(S))}catch(e){}};

// ===== CSV -> oyun verisi =====
const col=(F,...c)=>{const low=F.map(x=>x.toLowerCase());for(const k of c){const i=low.indexOf(k);if(i>=0)return F[i]}for(const k of c){const i=low.findIndex(x=>x.includes(k));if(i>=0)return F[i]}return null};
const money=v=>{if(v==null)return 0;const s=String(v).toLowerCase().replace(/,/g,""),m=s.match(/[\d.]+/);if(!m)return 0;const x=parseFloat(m[0]);return isNaN(x)?0:x*(s.includes("m")?1e6:s.includes("k")?1e3:1)};
function toYear(d,se){const t=Date.parse(d);if(!isNaN(t)){const x=new Date(t);return x.getFullYear()+x.getMonth()/12+(x.getDate()-1)/365}const m=String(se||"").match(/^(\d\d)\/(\d\d)/);if(m){const y=+m[1];return(y>50?1900:2000)+y+0.5}return null}
function readCsv(url,label,fn){return new Promise((res,rej)=>{let n=0,F=null;Papa.parse(url,{download:true,header:true,skipEmptyLines:true,worker:false,
step:r=>{F=F||r.meta.fields;fn(r.data,F);if(++n%25000===0){const e=document.getElementById("prog");if(e)e.textContent=`${label} okunuyor… ${n.toLocaleString("tr")} satır (ilk açılış uzun sürebilir)`}},
complete:()=>n?res(F):rej(new Error(`${url} boş ya da bulunamadı.`)),error:()=>rej(new Error(`${url} okunamadı. Dosya repoda bu yolda mı?`))})})}
function need(F,label,...c){const r=col(F,...c);if(!r)throw new Error(`'${label}' sütunu bulunamadı.\nMevcut sütunlar: ${F.join(", ")}`);return r}
// Güncel kulüp transfer geçmişinde yoksa (kiralık, yeni transfer, altyapı kaydı) profildeki kulüp + katılış tarihiyle tamamla
// Veri dosyasından sonra gerçekleşen transferler: [oyuncu_id, kulüp_id, tarih, kulüp adı]. ID'leri Transfermarkt linkinden al: /spieler/ID ve /verein/ID
const MOVES=[[648195,281,"2026-09-01","Manchester City"]];
function applyMoves(p,id,s,clubs){for(const[pid,cid,d,nm]of MOVES){if(pid!=id)continue;const t=toYear(d,null);if(t==null)continue;const last=s[s.length-1];if(last&&last[2]>t)last[2]=+t.toFixed(1);s.push([cid,+t.toFixed(1),NOW]);clubs[cid]=nm||clubs[cid]||("Kulüp "+cid);if(nm)p.c=nm}}
function fixCur(p,s,clubs){if(!p.c||!p.cid)return;const last=s[s.length-1];if(last&&last[0]===p.cid)return;
const j=toYear(p.j,null),st=Math.max(j!=null?j:NOW-0.5,last?last[1]:0);if(last&&last[2]>st)last[2]=+st.toFixed(1);s.push([p.cid,+st.toFixed(1),NOW]);clubs[p.cid]=p.c}
// updates.csv: veri dosyasından sonraki transferler. Sütunlar: player_id (ops.), player, club_id (ops.), club, joined (YYYY-MM-DD)
function applyUpdates(L,clubs,U){if(!U||!U.trim())return;const rows=Papa.parse(U,{header:true,skipEmptyLines:true}).data,byId={},byName={},cn={};
L.forEach(e=>{byId[e.id]=e;(byName[norm(e.n)]??=[]).push(e)});for(const c in clubs)cn[norm(clubs[c])]=+c;
const g=(r,...k)=>{for(const x of k)if(r[x]!=null&&String(r[x]).trim()!=="")return String(r[x]).trim();return""};
const list=rows.map(r=>({r,y:toYear(g(r,"joined","date","transfer_date"),null)})).filter(x=>x.y!=null).sort((a,b)=>a.y-b.y);let n=0;
for(const{r,y}of list){const pid=g(r,"player_id"),e=pid?byId[pid]:(byName[norm(g(r,"player","player_name","name"))]||[])[0];if(!e)continue;
const cname=g(r,"club","club_name","to_club_name"),cid=+g(r,"club_id","to_club_id")||cn[norm(cname)];if(!cid)continue;
const last=e.s[e.s.length-1];if(last&&last[0]===cid&&last[2]>=NOW-0.01)continue;
if(last&&last[2]>y)last[2]=+y.toFixed(1);e.s.push([cid,+y.toFixed(1),NOW]);clubs[cid]=cname||clubs[cid]||String(cid);e.c=cname||e.c;n++}
console.log("güncelleme uygulandı:",n)}
async function build(U){
const prof={};let pc;await readCsv(CFG.profiles,"Oyuncular",(r,F)=>{pc=pc||{id:need(F,"oyuncu id","player_id"),n:need(F,"oyuncu adı","player_name","name"),img:col(F,"image","photo"),v:col(F,"market_value"),c:col(F,"current_club_name"),cid:col(F,"current_club_id"),j:col(F,"joined")};
const id=r[pc.id];if(id&&!prof[id])prof[id]={n:r[pc.n],img:pc.img&&/^http/.test(r[pc.img]||"")?r[pc.img]:"",v:pc.v?money(r[pc.v]):0,c:pc.c?(r[pc.c]||""):"",cid:pc.cid?(+r[pc.cid]||0):0,j:pc.j?r[pc.j]:""}});
const T={};let tc;await readCsv(CFG.transfers,"Transferler",(r,F)=>{tc=tc||{id:need(F,"oyuncu id","player_id"),to:need(F,"hedef takım id","to_team_id","to_club_id"),tn:need(F,"hedef takım adı","to_team_name","to_club_name"),d:col(F,"transfer_date","date"),s:col(F,"season"),v:col(F,"value_at_transfer","market_value")};
const id=r[tc.id],to=r[tc.to];if(!id||!to||!prof[id])return;const t=toYear(tc.d?r[tc.d]:null,tc.s?r[tc.s]:null);if(t==null)return;(T[id]??=[]).push([t,to,r[tc.tn],tc.v?money(r[tc.v]):0])});
const BAD=/retired|without club|career break|unknown|^ban$|suspended/i,clubs={},L=[];
for(const id in T){const g=T[id].sort((a,b)=>a[0]-b[0]),s=[];let f=prof[id].v;
g.forEach(([t,to,tn,v],i)=>{f=Math.max(f,v);const end=i+1<g.length?g[i+1][0]:(prof[id].c?NOW:t+2);if(BAD.test(tn)||end-t<0.25)return;s.push([+to,+t.toFixed(1),+end.toFixed(1)]);clubs[to]=tn});
fixCur(prof[id],s,clubs);applyMoves(prof[id],id,s,clubs);if(s.length&&prof[id].n&&String(prof[id].n).trim()&&Math.max(...s.map(x=>x[2]))>=CFG.since)L.push({f,k:s.length,id:+id,n:prof[id].n,img:prof[id].img,c:prof[id].c,s})}
applyUpdates(L,clubs,U);L.sort((a,b)=>b.f-a.f||b.k-a.k);const players=L.slice(0,CFG.top).map(({id,n,img,c,s,f})=>({id,n,img,c,s,f:Math.round(f/1e5)}));
const used=new Set(players.flatMap(p=>p.s.map(x=>x[0])));for(const c in clubs)if(!used.has(+c))delete clubs[c];
return{clubs,players}}
const hsh=t=>{let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
async function load(){
const U=await fetch(CFG.updates,{cache:"no-store"}).then(r=>r.ok?r.text():"").catch(()=>""),key=CFG.cache+"_"+hsh(U);
try{const c=localStorage.getItem(key);if(c)return JSON.parse(c)}catch(e){}
const D=await build(U);try{Object.keys(localStorage).filter(k=>k.startsWith("tz_data")).forEach(k=>localStorage.removeItem(k));localStorage.setItem(key,JSON.stringify(D))}catch(e){}return D}
load().then(init).catch(e=>app.innerHTML=`<div class="card"><b>Hata</b><pre style="white-space:pre-wrap;font-size:13px">${esc(e.message)}</pre><p class="mu">Çözülmezse bu mesajı Claude'a yapıştır.</p></div>`);

// ===== Oyun =====
const EPOCH=Date.UTC(2026,10,1),TZ="Europe/Istanbul"; // EPOCH: #1 numaralı gridin tarihi
const TR4=[141,36,114,449];let VIEW="game",MENU=false,TIER=[],HINT,HN=0,info="",IDX={},POP=[],W=[];
const dayNo=()=>{const[y,m,d]=new Date().toLocaleDateString("sv",{timeZone:TZ}).split("-").map(Number);return Math.max(1,Math.floor((Date.UTC(y,m-1,d)-EPOCH)/864e5)+1)};
const ov=(x,y)=>{const o=Math.min(x[2],y[2])-Math.max(x[1],y[1]);return o>=0.25||(o>0&&x[2]>=2026.8&&y[2]>=2026.8)}; // ikisi de hâlâ aynı kulüpteyse süre ne olursa olsun takım arkadaşı
const shared=(i,j)=>{const r=new Set;for(const x of P[i].s)for(const y of P[j].s)if(x[0]===y[0]&&ov(x,y))r.add(x[0]);return[...r]};
function bfs(a){const d=new Int16Array(P.length).fill(-1),pr=new Int32Array(P.length).fill(-1);d[a]=0;const q=[a];for(let h=0;h<q.length;h++){const x=q[h];for(const y of ADJ[x])if(d[y]<0){d[y]=d[x]+1;pr[y]=x;q.push(y)}}return{d,pr}}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function wpick(R,L){let s=0;for(const i of L)s+=W[i];let r=R()*s;for(const i of L){r-=W[i];if(r<=0)return i}return L[L.length-1]}
function init(D){P=D.players;CN=D.clubs;IDX={};P.forEach((p,i)=>IDX[p.id]=i);const by={};P.forEach((p,i)=>p.s.forEach(s=>(by[s[0]]??=[]).push([i,s])));
ADJ=P.map(()=>new Set);for(const c in by){const L=by[c];for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++){const[i,a]=L[x],[j,b]=L[y];if(i!==j&&ov(a,b)){ADJ[i].add(j);ADJ[j].add(i)}}}
// Popülerlik: piyasa değeri (açık eşikler) + eski oyuncular için büyük kulüplerde geçirilen yıllar. Bilinmeyenler günün oyuncusu olmaz (W=0).
const pres={};P.slice(0,1500).forEach(p=>new Set(p.s.map(x=>x[0])).forEach(c=>pres[c]=(pres[c]||0)+1));
const f=P.map(p=>p.f||0),s2=p=>{let b=0;for(const[c,x,y]of p.s)b=Math.max(b,Math.min(y-x,10)*(pres[c]||0));return b};
TIER=f.map(x=>x>=150?3:x>=80?2:x>=50?1:0); // 3 çok bilinen, 2 orta, 1 az bilinen, 0 hiç tanınmayan (asla çıkmaz)
P.forEach((p,i)=>{if(f[i]>=80&&p.s.some(x=>TR4.includes(x[0])))TIER[i]=3});
const old=[];P.forEach((p,i)=>{if(f[i]<80&&Math.max(...p.s.map(x=>x[2]))<2019)old.push([i,s2(p)])});
old.sort((a,b)=>b[1]-a[1]).forEach(([i],r)=>{if(r<150)TIER[i]=Math.max(TIER[i],2);else if(r<600)TIER[i]=Math.max(TIER[i],1)});
TODAY=dayNo();CUR=TODAY;READY=true;if(S.user)loadPuzzle(CUR);else login();

function makePuzzle(n){const R=rng(n*7919+13),by=[[],[],[],[]];TIER.forEach((t,i)=>by[t].push(i));
