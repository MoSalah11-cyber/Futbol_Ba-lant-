<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transfer Zinciri</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14201a;--mu:#6b7a72;--ac:#0f9d58;--bd:#dfe6e1;--bad:#d93025}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1512;--card:#18211c;--tx:#eaf2ed;--mu:#8fa196;--ac:#2fd07f;--bd:#2a362f;--bad:#ff6b5e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 2px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.av,.cl{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden}
.av{width:44px;height:44px;border-radius:50%;font-size:14px}.cl{width:26px;height:26px;border-radius:6px;font-size:9px;margin-right:4px}
.av img,.cl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}.cl img{object-fit:contain;padding:2px}
.clubs{display:flex;flex-wrap:wrap;margin-top:6px}
.link{margin:2px 0 2px 21px;padding-left:19px;border-left:3px dashed var(--ac);min-height:30px;display:flex;align-items:center}
input{width:100%;padding:14px;font-size:16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{font:inherit;padding:12px 16px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.sg{padding:8px 12px;border-bottom:1px solid var(--bd);cursor:pointer}.sg:last-child{border:0}
.msg{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0}.tgt{border:2px solid var(--ac)}.big{font-size:20px;font-weight:700}
.stats{display:flex;gap:8px;text-align:center}.stats div{flex:1}.stats b{display:block;font-size:22px}
</style></head><body><div id="app">Yükleniyor…</div>
<script>
// ===== AYARLAR: CSV dosyalarının repo içindeki yolu =====
const CFG={profiles:"player_profiles.csv",transfers:"transfer_history.csv",top:20000,since:1985,cache:"tz_data_v2"};
const app=document.getElementById("app"),LOGO=id=>`https://tmssl.akamaized.net/images/wappen/head/${id}.png`,NOW=2026.8;
const norm=s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
let P,CN,ADJ,A,B,OPT,NO,KEY,S={user:"",days:{}},chain,mist=0,msg="",q="";
try{S=JSON.parse(localStorage.getItem("tz"))||S}catch(e){}
const save=()=>{try{localStorage.setItem("tz",JSON.stringify(S))}catch(e){}};

// ===== CSV -> oyun verisi =====
const col=(F,...c)=>{const low=F.map(x=>x.toLowerCase());for(const k of c){const i=low.indexOf(k);if(i>=0)return F[i]}for(const k of c){const i=low.findIndex(x=>x.includes(k));if(i>=0)return F[i]}return null};
const money=v=>{if(v==null)return 0;const s=String(v).toLowerCase().replace(/,/g,""),m=s.match(/[\d.]+/);if(!m)return 0;const x=parseFloat(m[0]);return isNaN(x)?0:x*(s.includes("m")?1e6:s.includes("k")?1e3:1)};
function toYear(d,se){const t=Date.parse(d);if(!isNaN(t)){const x=new Date(t);return x.getFullYear()+x.getMonth()/12+(x.getDate()-1)/365}const m=String(se||"").match(/^(\d\d)\/(\d\d)/);if(m){const y=+m[1];return(y>50?1900:2000)+y+0.5}return null}
function readCsv(url,label,fn){return new Promise((res,rej)=>{let n=0,F=null;Papa.parse(url,{download:true,header:true,skipEmptyLines:true,worker:false,
step:r=>{F=F||r.meta.fields;fn(r.data,F);if(++n%25000===0)app.innerHTML=`<p>${label} okunuyor… ${n.toLocaleString("tr")} satır</p><p class="mu">İlk açılış biraz sürebilir, sonra hızlı açılır.</p>`},
complete:()=>n?res(F):rej(new Error(`${url} boş ya da bulunamadı.`)),error:()=>rej(new Error(`${url} okunamadı. Dosya repoda bu yolda mı?`))})})}
function need(F,label,...c){const r=col(F,...c);if(!r)throw new Error(`'${label}' sütunu bulunamadı.\nMevcut sütunlar: ${F.join(", ")}`);return r}
async function build(){
const prof={};let pc;await readCsv(CFG.profiles,"Oyuncular",(r,F)=>{pc=pc||{id:need(F,"oyuncu id","player_id"),n:need(F,"oyuncu adı","player_name","name"),img:col(F,"image","photo"),v:col(F,"market_value"),c:col(F,"current_club_name")};
const id=r[pc.id];if(id&&!prof[id])prof[id]={n:r[pc.n],img:pc.img&&/^http/.test(r[pc.img]||"")?r[pc.img]:"",v:pc.v?money(r[pc.v]):0,c:pc.c?(r[pc.c]||""):""}});
const T={};let tc;await readCsv(CFG.transfers,"Transferler",(r,F)=>{tc=tc||{id:need(F,"oyuncu id","player_id"),to:need(F,"hedef takım id","to_team_id","to_club_id"),tn:need(F,"hedef takım adı","to_team_name","to_club_name"),d:col(F,"transfer_date","date"),s:col(F,"season"),v:col(F,"value_at_transfer","market_value")};
const id=r[tc.id],to=r[tc.to];if(!id||!to||!prof[id])return;const t=toYear(tc.d?r[tc.d]:null,tc.s?r[tc.s]:null);if(t==null)return;(T[id]??=[]).push([t,to,r[tc.tn],tc.v?money(r[tc.v]):0])});
const BAD=/retired|without club|career break|unknown|^ban$|suspended/i,clubs={},L=[];
for(const id in T){const g=T[id].sort((a,b)=>a[0]-b[0]),s=[];let f=prof[id].v;
g.forEach(([t,to,tn,v],i)=>{f=Math.max(f,v);const end=i+1<g.length?g[i+1][0]:(t>NOW-8?NOW:t+3);if(BAD.test(tn)||end-t<0.5)return;s.push([+to,+t.toFixed(1),+end.toFixed(1)]);clubs[to]=tn});
if(s.length&&Math.max(...s.map(x=>x[2]))>=CFG.since)L.push({f,k:s.length,id:+id,n:prof[id].n,img:prof[id].img,c:prof[id].c,s})}
L.sort((a,b)=>b.f-a.f||b.k-a.k);const players=L.slice(0,CFG.top).map(({id,n,img,c,s})=>({id,n,img,c,s}));
const used=new Set(players.flatMap(p=>p.s.map(x=>x[0])));for(const c in clubs)if(!used.has(+c))delete clubs[c];
return{clubs,players}}
async function load(){
try{const c=localStorage.getItem(CFG.cache);if(c)return JSON.parse(c)}catch(e){}
const D=await build();try{localStorage.setItem(CFG.cache,JSON.stringify(D))}catch(e){}return D}
load().then(init).catch(e=>app.innerHTML=`<div class="card"><b>Hata</b><pre style="white-space:pre-wrap;font-size:13px">${esc(e.message)}</pre><p class="mu">Çözülmezse bu mesajı Claude'a yapıştır.</p></div>`);

// ===== Oyun =====
const ov=(x,y)=>Math.min(x[2],y[2])-Math.max(x[1],y[1])>=0.5;
const shared=(i,j)=>{const r=new Set;for(const x of P[i].s)for(const y of P[j].s)if(x[0]===y[0]&&ov(x,y))r.add(x[0]);return[...r]};
function bfs(a){const d=new Int16Array(P.length).fill(-1),pr=new Int32Array(P.length).fill(-1);d[a]=0;const q=[a];for(let h=0;h<q.length;h++){const x=q[h];for(const y of ADJ[x])if(d[y]<0){d[y]=d[x]+1;pr[y]=x;q.push(y)}}return{d,pr}}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function init(D){P=D.players;CN=D.clubs;const by={};P.forEach((p,i)=>p.s.forEach(s=>(by[s[0]]??=[]).push([i,s])));
ADJ=P.map(()=>new Set);for(const c in by){const L=by[c];for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++){const[i,a]=L[x],[j,b]=L[y];if(i!==j&&ov(a,b)){ADJ[i].add(j);ADJ[j].add(i)}}}
const n=new Date();KEY=n.toLocaleDateString("sv");NO=Math.max(1,Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(2026,10,1))/864e5)+1);
let hs=0;for(const c of KEY)hs=(hs*131+c.charCodeAt(0))%1000003;const R=rng(hs),top=Math.min(500,P.length);
for(let k=0;k<300;k++){const a=Math.floor(R()*top),{d}=bfs(a),c=[];for(let j=0;j<top;j++)if(d[j]>=3&&d[j]<=4)c.push(j);if(c.length){A=a;B=c[Math.floor(R()*c.length)];OPT=d[B];break}}
if(A==null)return app.textContent="Uygun bulmaca bulunamadı (veri çok seyrek).";chain=[A];render()}
const ini=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("");
const av=i=>`<span class="av" style="background:hsl(${hue(P[i].n)},45%,38%)">${esc(ini(P[i].n))}${P[i].img?`<img src="${esc(P[i].img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</span>`;
const cl=c=>`<span class="cl" title="${esc(CN[c]||"")}" style="background:hsl(${hue(c)},55%,40%)">${esc((CN[c]||"").replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g,"").slice(0,3).toUpperCase())}<img src="${LOGO(c)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
const clubsOf=i=>[...new Set(P[i].s.map(x=>x[0]))];
const streak=()=>{let n=0,d=new Date();if(!S.days[d.toLocaleDateString("sv")]?.w)d.setDate(d.getDate()-1);while(S.days[d.toLocaleDateString("sv")]?.w){n++;d.setDate(d.getDate()-1)}return n};
function login(){app.innerHTML=`<h1>🔗 Transfer Zinciri</h1><p class="mu">Her gün iki futbolcu: ortak takımda oynadıkları oyuncularla en kısa zinciri kur.</p><div class="card"><p>Kullanıcı adın:</p><input id="u" maxlength="20" placeholder="örn. mbt"><p></p><button id="go" style="width:100%">Giriş yap</button></div>`;
document.getElementById("go").onclick=()=>{const v=document.getElementById("u").value.trim();if(v){S.user=v;save();render()}}}
function share(){const r=S.days[KEY],t=`Transfer Zinciri #${NO}\n${P[A].n} → ${P[B].n}\n${r.w?"🟩".repeat(r.l)+` (${r.l} halka, en kısa ${OPT})`:"🟥 Çözemedim"}${r.m?"\n❌×"+r.m:""}\n🔥 Seri: ${streak()}`;
if(navigator.share)navigator.share({text:t}).catch(()=>{});else try{navigator.clipboard.writeText(t);alert("Kopyalandı!")}catch(e){prompt("Kopyala:",t)}}
function render(){if(!S.user)return login();const r=S.days[KEY];
let h=`<h1>🔗 Transfer Zinciri #${NO}</h1><span class="mu">👤 ${esc(S.user)} · 🔥 ${streak()} gün seri</span>`;
h+=`<div class="card tgt"><div class="mu">HEDEF · en kısa yol ${OPT} halka</div><div class="row" style="margin-top:6px">${av(B)}<div><b>${esc(P[B].n)}</b><div class="clubs">${clubsOf(B).map(cl).join("")}</div></div></div></div><div class="card">`;
chain.forEach((n,i)=>{if(i)h+=`<div class="link">${shared(chain[i-1],n).map(cl).join("")}</div>`;h+=`<div class="row">${av(n)}<b>${esc(P[n].n)}</b></div>`});h+=`</div>`;
if(r){const path=[],{pr}=bfs(A);for(let x=B;x>=0;x=pr[x])path.unshift(P[x].n);
h+=`<div class="card"><div class="big">${r.w?"🎉 Çözdün! "+r.l+" halka":"😕 Bugün olmadı"}</div><p class="mu">Hata: ${r.m}. ${r.w&&r.l===OPT?"Mükemmel, en kısa yol!":"En kısa yol: "+path.map(esc).join(" → ")}</p><button id="sh" style="width:100%">Paylaş</button></div>
<div class="card stats"><div><b>${Object.keys(S.days).length}</b><span class="mu">oynanan</span></div><div><b>${Object.values(S.days).filter(d=>d.w).length}</b><span class="mu">çözülen</span></div><div><b>${streak()}</b><span class="mu">seri</span></div></div><p class="mu" style="text-align:center">Yarın yeni bulmaca!</p>`;
app.innerHTML=h;document.getElementById("sh").onclick=share;return}
const last=chain[chain.length-1];
h+=`<div class="card"><div class="mu">Şu an: <b>${esc(P[last].n)}</b> — ortak takımda oynadığı bir futbolcu yaz</div><div class="clubs">${clubsOf(last).map(cl).join("")}</div><p></p><input id="q" placeholder="Futbolcu ara…" value="${esc(q)}" autocomplete="off"><div class="msg">${esc(msg)}</div><div id="sg"></div><div class="row sp mu">Hata: ${mist}/5<button class="g" id="un" ${chain.length<2?"disabled":""}>Geri al</button></div></div>`;
app.innerHTML=h;const inp=document.getElementById("q"),sg=document.getElementById("sg");
inp.oninput=()=>{q=inp.value;const v=norm(q);if(!v){sg.innerHTML="";return}const L=[];for(let i=0;i<P.length&&L.length<6;i++)if(!chain.includes(i)&&norm(P[i].n).includes(v))L.push(i);
sg.innerHTML=L.length?`<div class="card" style="padding:0">`+L.map(i=>`<div class="sg row" data-i="${i}">${av(i)}<div>${esc(P[i].n)}<div class="mu">${esc(P[i].c||"")}</div></div></div>`).join("")+`</div>`:"";
sg.querySelectorAll(".sg").forEach(e=>e.onclick=()=>pick(+e.dataset.i))};
if(q)inp.oninput();
document.getElementById("un").onclick=()=>{if(chain.length>1){chain.pop();msg="";q="";render()}}}
function pick(i){q="";const last=chain[chain.length-1];
if(ADJ[last].has(i)){chain.push(i);msg="";if(i===B){S.days[KEY]={w:1,l:chain.length-1,m:mist};save()}}
else{mist++;msg=`${P[i].n}, ${P[last].n} ile ortak takımda oynamadı ❌`;if(mist>=5){S.days[KEY]={w:0,l:0,m:mist};save()}}render()}
</script></body></html>
